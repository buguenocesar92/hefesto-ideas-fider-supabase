services:
  preflight:
    environment:
      HEFESTO_BOOTSTRAP: "true"
  app:
    restart: "no"
    ports: ["127.0.0.1:8098:3000"]
    depends_on:
      mailpit:
        condition: service_started
    environment:
      HEFESTO_BOOTSTRAP: "true"
      BASE_URL: http://localhost:8098
      SIGNUP_DISABLED: "false"
      EMAIL_NOREPLY: noreply@example.test
      EMAIL_SMTP_HOST: mailpit
      EMAIL_SMTP_PORT: "1025"
      EMAIL_SMTP_USERNAME: ""
      EMAIL_SMTP_PASSWORD: ""
      EMAIL_SMTP_ENABLE_STARTTLS: "false"
      EMAIL_SMTP_ENABLE_IMPLICIT_TLS: "false"
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    restart: "no"
    ports: ["127.0.0.1:8026:8025"]
    # No SMTP host port, relay or persistent mailbox: test messages stay in this container.
